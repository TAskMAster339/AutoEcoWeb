# Frontend container config.
# Serves the SPA and (for standalone use) proxies /api to the backend.
# In deploy mode the browser only talks to the gateway nginx, which routes
# /api to the backend itself — this proxy is a safety net so the container
# stays fully functional when accessed directly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos may grow later
    client_max_body_size 16m;

    # API (standalone mode: direct access to the frontend container)
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — react-router paths (transactions, analytics, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Never cache index.html (fresh deploys must be picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
