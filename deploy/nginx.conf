server {
    listen 80;
    server_name autoeco.mooo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker healthcheck stays on plain http (no TLS to 127.0.0.1).
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autoeco.mooo.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/autoeco.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoeco.mooo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16m;
    keepalive_timeout 65;
    send_timeout 30s;

    # Compress dynamic/proxied text responses at the public gateway.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:80/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:80/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:80/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:80/openapi.json;
        proxy_set_header Host $host;
    }

    # Vite filenames contain a content hash and can be cached indefinitely.
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public crawler/PWA files are stable, but are not content-addressed.
    location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.svg|social-preview\.png)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HTML/SPA shell must be revalidated after every deployment.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
