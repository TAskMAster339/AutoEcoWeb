# AutoEcoWeb — nginx gateway (deploy mode).
# Single public entry point on :80. Routes:
#   /        -> frontend container (built static assets)
#   /api/*   -> backend FastAPI
#   /docs, /openapi.json -> backend OpenAPI docs
#   /health  -> backend health check
#   /healthz -> gateway health check (used by Docker healthcheck)

server {
    listen 80;
    server_name _;

    # Receipt photos may grow later
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- API ---
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:80/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:80/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:80/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:80/openapi.json;
        proxy_set_header Host $host;
    }

    # --- Frontend (SPA) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Gateway healthcheck ---
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
