[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "regex>=2024.11.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=1.18.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
    asyncio_mode = "auto"
    pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
