# AutoEcoWeb — production deployment.
#   docker compose -f docker-compose.deploy.yml up -d --build
#
# Only port 80 (nginx gateway) is exposed:
#   /        -> frontend static (built assets)
#   /api/*   -> backend FastAPI
#   /docs    -> backend OpenAPI docs
#   /health  -> backend health check

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - 80:80
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # One domain: frontend calls the API same-origin (/api), the gateway
        # proxies it to the backend. Mock data is dev-only — override with
        # VITE_USE_MOCK_API=true at deploy time while backend endpoints land.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    restart: always
    expose:
      - 80
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: always
    # env_file: the whole root .env (POSTGRES_*, JWT_SECRET) becomes the
    # container environment — no per-variable listing. Copy .env.example.
    env_file:
      - .env
    expose:
      - 80
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB_NAME from root .env.
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # $$ = literal $ for the container shell — values come from env_file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres:
    driver: local
