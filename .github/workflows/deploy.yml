name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install, test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend - locked install, lint, typing and tests
        working-directory: backend
        env:
          # Значения фиктивные: Settings (pydantic-settings) требует эти поля при
          # импорте, а тесты ходят в sqlite in-memory (conftest), не в postgres
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB_NAME: test
          JWT_SECRET: test-secret
          APP_ENV: test
        run: |
          python -m pip install uv
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run mypy src
          uv run pytest tests/ -q
      - name: Check generated OpenAPI contract
        working-directory: frontend
        env:
          API_PYTHON: ../backend/.venv/bin/python
        run: |
          npm run api:generate
          git diff --exit-code -- openapi.json src/api/generated.ts

  postgres-integration:
    name: PostgreSQL migrations and locking
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autoeco_test
          POSTGRES_PASSWORD: autoeco_test
          POSTGRES_DB: autoeco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoeco_test -d autoeco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: autoeco_test
      POSTGRES_PASSWORD: autoeco_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB_NAME: autoeco_test
      JWT_SECRET: postgres-integration-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv
          uv sync --locked --group dev

      - name: Apply migrations and exercise PostgreSQL locks
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run pytest postgres_tests/ -q

  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    needs: [test, postgres-integration]
    steps:
      - name: Обновление и пересборка на autoeco.mooo.com
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: autoeco.mooo.com
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            set -e
            cd /home/deploy/AutoEcoWeb
            # Сбрасываем случайные правки отслеживаемых файлов (сервер — деплой-таргет, не рабочая копия)
            git checkout -- .
            git pull --ff-only origin main
            # Собираем образы, но стек пока НЕ поднимаем: сначала накатываем миграции,
            # чтобы новый backend не успел отдать 500 на непромигрированную БД.
            docker compose -f docker-compose.deploy.yml build
            # Прогон alembic-миграций на прод-БД (env из .env на сервере).
            # Идемпотентно: применяет только новые ревизии; падение = фейл деплоя.
            # -T: без псевдо-TTY (ssh-action запускает команды без tty).
            docker compose -f docker-compose.deploy.yml run --rm -T backend alembic upgrade head
            docker compose -f docker-compose.deploy.yml up -d
            # nginx кэширует IP апстримов (backend/frontend) при старте, а контейнеры
            # после пересборки получают новые IP → 502 до пересоздания nginx.
            # Пересоздаём ВСЕГДА; заодно подхватывается свежий nginx.conf (git заменяет inode).
            docker compose -f docker-compose.deploy.yml up -d --force-recreate nginx
            # Ждём готовности: backend стартует несколько секунд после пересоздания
            for i in $(seq 1 12); do
              curl -sf https://autoeco.mooo.com/health >/dev/null && break
              sleep 5
            done
            curl -sf https://autoeco.mooo.com/health >/dev/null
            curl -sf -o /dev/null https://autoeco.mooo.com/
