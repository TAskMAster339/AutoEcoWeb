services:
  backend:
    build: ./backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
    ports: 
    - 80:80
    develop:
      watch:
      - action: sync+restart
        path: ./backend
        target: ./app
      - action: rebuild
        path: backend/requirements.txt
    depends_on:
     - postgres

  adminer:
    image: adminer
    restart: always
    ports:
     - 8080:8080
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    restart: always
    shm_size: 128 mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
    ports:
      - '5432:5432'
    volumes: 
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
    driver: local
